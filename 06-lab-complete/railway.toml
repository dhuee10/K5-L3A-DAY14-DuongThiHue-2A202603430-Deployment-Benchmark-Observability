# Railway — build bằng Dockerfile, PORT do Railway cấp (CMD dùng ${PORT:-8000})
# Biến môi trường đặt trên Railway (không ghi ở đây):
#   AGENT_API_KEY, REDIS_URL (=${{Redis.REDIS_URL}}), ENVIRONMENT, RATE_LIMIT_PER_MINUTE,
#   DAILY_BUDGET_USD, MONTHLY_BUDGET_USD

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
